name: Database activity check

# Once a day, connects straight to the production database and runs `SELECT 1`, so the
# free Supabase project sees activity even if Render or the other workflows stop
# reaching it (Supabase pauses a free project after 7 days without activity:
# docs/RECOVERY.md, section 4). The nightly backup and the hourly jobs also reach the
# database; this check does not depend on the app being up.
#
# It reads nothing and writes nothing: `SELECT 1` touches no table. It connects as
# hostel_app (the DATABASE_URL secret the migrate workflow already uses), the role with
# the fewest rights. The URL is never printed: GitHub masks the secret, and on failure
# only the error code is shown, never the error text.
#
# GitHub starts scheduled runs late, often by hours, and sometimes skips one (2026-11-18:
# the hourly jobs ran about 24 times in 7 days). A late or skipped day is harmless: a
# pause needs 7 days without activity.
#
# A failed run (database paused or unreachable, wrong secret) makes GitHub email the
# repository owner. Free: a public repository's Actions minutes cost nothing. GitHub
# turns off scheduled workflows in a public repository after 60 days without any commit;
# it emails a warning first. Re-enable it from the Actions tab.
on:
  schedule:
    - cron: "47 9 * * *" # 15:17 India time, away from the backup and the hourly jobs
  workflow_dispatch: # "Run workflow" button

permissions:
  contents: read

concurrency:
  group: db-activity
  cancel-in-progress: false

jobs:
  select-one:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    # DATABASE_URL is given only to the two steps that need it, not to the install step,
    # so no package's code ever runs with the secret in its environment.
    steps:
      - name: Check the secret is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is missing"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The server's runtime packages, for pg at the version its lockfile pins. No
      # install scripts run, and no server code is started.
      - name: Install pg
        working-directory: server
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Run SELECT 1
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node - <<'EOF'
          const { Client } = require("pg");
          // Supabase's certificate is signed by its own CA: encrypt, as the app does
          // (sslmode=no-verify), unless the URL turns encryption off.
          let url;
          try {
            url = new URL(process.env.DATABASE_URL);
          } catch {
            // Node's own message would quote the whole value.
            console.log("DATABASE_URL is not a valid URL.");
            process.exit(1);
          }
          if (url.searchParams.get("sslmode") !== "disable") url.searchParams.set("sslmode", "no-verify");

          async function once() {
            const client = new Client({
              connectionString: url.toString(),
              connectionTimeoutMillis: 15000,
              query_timeout: 15000,
              application_name: "db-activity-check",
            });
            // A dropped connection is reported here; without a listener Node would crash
            // and print the error's text.
            client.on("error", () => {});
            try {
              await client.connect();
              const { rows } = await client.query("SELECT 1 AS ok");
              if (rows[0]?.ok !== 1) throw Object.assign(new Error("unexpected answer"), { code: "bad_answer" });
            } finally {
              await client.end().catch(() => {});
            }
          }

          (async () => {
            // Two tries, 30 s apart, for a passing network hiccup.
            for (let attempt = 1; attempt <= 2; attempt++) {
              try {
                await once();
                console.log("SELECT 1 answered: the database is up.");
                return;
              } catch (err) {
                // Only the code: an error's text could quote part of the connection.
                console.log(`Attempt ${attempt} failed (code ${err?.code ?? "unknown"}).`);
                if (attempt < 2) await new Promise((r) => setTimeout(r, 30000));
              }
            }
            process.exit(1);
          })();
          EOF
