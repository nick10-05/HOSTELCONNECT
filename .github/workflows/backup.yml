name: Backup database

# Nightly encrypted dump of the production database, kept as a workflow artifact.
#
# The dump is encrypted with age to the public key in the AGE_PUBLIC_KEY secret before
# it is stored. Only the matching private key, kept offline by the owner, can open it.
# That matters because this repository is public: anyone signed in to GitHub can
# download its artifacts.
#
# Restore drill and restoring a backup: docs/RECOVERY.md (sections 5 and 9).
#
# Missed-backup alert (docs/deploy.md, "Missed-backup alert"): with the secret
# HEALTHCHECKS_PING_URL set, each run tells Healthchecks.io when it starts and whether it
# ended well. Healthchecks.io emails when a run fails, or when no run finishes at all by
# the next morning: a run GitHub silently dropped, or schedules switched off after 60 days
# without a commit, which GitHub's own failure emails never report. Without the secret
# these steps do nothing, and a Healthchecks.io outage never fails the backup.
# GitHub turns off scheduled workflows in a public repository after 60 days without
# any commit; it emails a warning first. Re-enable it from the Actions tab.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 India time
  workflow_dispatch: # "Run workflow" button, e.g. before a risky change

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      # The dump reads as hostel_backup: since migration 018, row-level security shows
      # hostel_app one hostel's rows at most, while hostel_backup may read every row of
      # every hostel and write none. hostel_backup has no login between backups. Each
      # night the job gives it a new random password with the migration credential (the
      # same secret the migrate workflow uses), dumps, and locks it again
      # (server/scripts/backup-login.ts). The password and URL are hidden in the log.
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
      # Not a database credential, but anyone holding it could report a backup that never
      # ran, so it is a secret too. curl reads it from standard input (-K -), so it is
      # never on a command line; GitHub masks it in the log.
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - name: Check the secrets are set
        run: |
          test -n "$MIGRATION_DATABASE_URL" || { echo "MIGRATION_DATABASE_URL secret is missing"; exit 1; }
          case "$AGE_PUBLIC_KEY" in age1*) ;; *) echo "AGE_PUBLIC_KEY must be an age1... public key"; exit 1;; esac

      - name: Tell Healthchecks.io the backup started
        run: |
          [ -n "$HEALTHCHECKS_PING_URL" ] || { echo "No HEALTHCHECKS_PING_URL: no missed-backup alert."; exit 0; }
          printf 'url = "%s/start"\n' "$HEALTHCHECKS_PING_URL" |
            curl --silent --show-error --fail --max-time 10 --retry 3 --output /dev/null -K - ||
            echo "::warning::Could not reach Healthchecks.io; the backup goes on."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install the server's packages
        working-directory: server
        run: npm ci

      # Sets BACKUP_DATABASE_URL for the steps below, through $GITHUB_ENV.
      - name: Open the backup login for this run
        working-directory: server
        run: npx tsx scripts/backup-login.ts open

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump and encrypt
        run: |
          set -euo pipefail
          file="hostelconnect-$(date -u +%Y-%m-%dT%H%MZ).dump.age"
          # pg_dump must be at least the server's major version, so it runs from the
          # same image as docker-compose.yml and CI. Only our schema; Supabase's own
          # schemas are not ours to restore.
          # Custom format (-Fc) is compressed, and pg_restore can load all of it (the
          # restore drill) or only the rows into a freshly migrated database (a real
          # recovery, docs/deploy.md). Owners and grants come from the migrations.
          # --enable-row-security: without it pg_dump refuses tables with row-level
          # security; with it, hostel_backup's policy shows it every row.
          # The unencrypted dump only ever exists inside this pipe, never as a file.
          docker run --rm -e BACKUP_DATABASE_URL postgres:17-alpine \
            sh -c 'exec pg_dump "$BACKUP_DATABASE_URL" --format=custom --schema=public --no-owner --no-privileges --enable-row-security' \
            | age --encrypt --recipient "$AGE_PUBLIC_KEY" > "$file"
          # An empty or failed dump would still make a small file; a real one is larger.
          size=$(stat -c %s "$file")
          echo "Backup $file: $size bytes"
          test "$size" -gt 2000 || { echo "Backup is suspiciously small"; exit 1; }
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          # The longest GitHub keeps artifacts: about 90 nightly backups at any time.
          retention-days: 90
          # Already compressed and encrypted; zipping again gains nothing.
          compression-level: 0

      # Even when a step above failed: hostel_backup goes back to having no login.
      - name: Lock the backup login again
        if: always()
        working-directory: server
        run: npx tsx scripts/backup-login.ts close

      # Last, after the login is locked: success only when every step above succeeded,
      # otherwise a failure, so Healthchecks.io emails at once.
      - name: Tell Healthchecks.io how the backup ended
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          [ -n "$HEALTHCHECKS_PING_URL" ] || exit 0
          if [ "$OUTCOME" = "success" ]; then suffix=""; else suffix="/fail"; fi
          printf 'url = "%s%s"\n' "$HEALTHCHECKS_PING_URL" "$suffix" |
            curl --silent --show-error --fail --max-time 10 --retry 3 --output /dev/null -K - ||
            { echo "::warning::Could not reach Healthchecks.io."; exit 0; }
          echo "Reported to Healthchecks.io: $OUTCOME"
